[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
  "crates/ll-canonical",
  "crates/ll-client",
  "crates/ll-crypto",
  "crates/ll-protocol",
  "crates/ll-server",
  "crates/ll-testkit",
  "crates/ll-versioning",
  "wasm/ll-client-core",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["http1", "tokio"] }
base32ct = { version = "0.3.1", features = ["alloc"] }
blake3 = "1.8.5"
bytes = "1.11.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hmac = "0.13.0"
hkdf = "0.13.0"
hex = "0.4.3"
minicbor = { version = "2.3.0", features = ["alloc", "std"] }
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = "0.10.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
wasm-bindgen = "0.2.126"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }
