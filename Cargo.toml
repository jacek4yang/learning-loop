[workspace]
resolver = "2"
members = [
  "crates/ll-canonical",
  "wasm/ll-client-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
wasm-bindgen = "0.2.126"
